name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyyaml ruff

      - name: Lint
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Compile Python files
        run: python -m compileall -q main.py core tests tools

      - name: Validate config schema JSON
        run: python -m json.tool _conf_schema.json > /dev/null

      - name: Check logo
        run: python tests/check_logo.py

      - name: Check metadata and repository hygiene
        run: python tests/check_metadata.py

      - name: Run self-test suite
        run: python tests/run_tests.py

      - name: Fetch AstrBot for authoritative schema rules
        run: git clone --depth 1 https://github.com/AstrBotDevs/AstrBot /tmp/AstrBot

      - name: Audit config schema against AstrBot
        env:
          ASTRBOT_REPO: /tmp/AstrBot
        run: python tests/check_schema.py
